spring:
  application:
    name: ocean-weather-reporter
  ai:
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: ${AI_RETRY_INITIAL_INTERVAL:1s}
        multiplier: ${AI_RETRY_MULTIPLIER:2}
        max-interval: ${AI_RETRY_MAX_INTERVAL:10s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${PORT:8080}
agent:
  max-coastal-distance-km: ${MAX_COASTAL_DISTANCE_KM:50}
  suggestion-radius-km: ${SUGGESTION_RADIUS_KM:300}
  suggestion-count: ${SUGGESTION_COUNT:5}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${RETRY_DELAY_MS:1000}
    multiplier: ${RETRY_MULTIPLIER:2.0}
logging:
  level:
    com.example.oceanweather: INFO
