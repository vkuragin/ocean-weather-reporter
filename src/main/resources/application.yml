spring:
  application:
    name: ocean-weather-reporter
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${WEATHER_REPORTER_SMTP_USERNAME:}
    password: ${WEATHER_REPORTER_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080

agent:
  max-coastal-distance-km: 30
  suggestion-radius-km: 100
  suggestion-count: 3
  retry:
    max-attempts: 3
    delay-ms: 1000
    multiplier: 1.5

open-meteo:
  geocoding-url: https://geocoding-api.open-meteo.com
  weather-url: https://api.open-meteo.com
  marine-url: https://marine-api.open-meteo.com
  weather-forecast-days: 3
  marine-forecast-days: 1
  marine-cell-selection: sea
  connect-timeout-ms: 3000
  read-timeout-ms: 10000

logging:
  level:
    com.example.oceanweather: INFO
