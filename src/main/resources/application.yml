spring:
  application:
    name: ocean-weather-reporter
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080

agent:
  max-coastal-distance-km: 10
  suggestion-radius-km: 100
  suggestion-count: 5
  retry:
    max-attempts: 3
    delay-ms: 1000
    multiplier: 1.5

logging:
  level:
    com.example.oceanweather: INFO
